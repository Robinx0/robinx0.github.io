# ─── about-page bio paragraphs ───
bio:
  - >
    I work on the red team at <strong>Shorborno Holdings Ltd</strong> on the
    <strong>Grameenphone</strong> project - Bangladesh's largest telco - focusing on
    penetration testing, Active Directory exploitation, EDR bypass, and custom tooling
    in C/C++ and Python. My day-to-day centers on simulating adversaries, stress-testing
    SOC detection, and running purple-team exercises.
  - >
    Before Shorborno I was a <strong>Security Researcher at PentesterSpace</strong>,
    where I worked across mobile, network, and AD pentesting with BloodHound,
    CrackMapExec, MobSF, and Burp Suite Pro. I've also spent time in non-security IT
    leadership - building full-stack systems and leading operations - which shaped how
    I think about defensive posture from the other side.
  - >
    Outside work I compete in CTFs, contribute to open-source security tooling, mentor
    students through the <strong>IIUC InfoSec Community</strong> I founded, and write
    about technique and methodology. My research interests span application &amp; AI
    security, IoT and automotive hacking, ML for threat detection, and agentic AI
    applied to offensive security.

